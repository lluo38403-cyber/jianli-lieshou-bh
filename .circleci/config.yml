# 简历猎手 · CircleCI 打包配置（v39，2026-11-22）
#
# 把 GitHub Actions 的“打 Windows exe”流程（.github/workflows/build-exe.yml）
# 搬到 CircleCI 免费版。原因：GitHub Actions 本月免费额度用完了
# （Compute $12.00/$12.00，Budgets 页 Usage blocked，2026-12-01 重置），
# CI 与打 exe 三批运行全在 2 秒内零步骤失败；lucky 2026-11-22 定走
# CircleCI 免费版（每月 30,000 credits，windows.medium 40 credits/分钟）。
#
# 两个 job 与 GH 流程一一对应：
#   build —— 前端构建 → pip 安装依赖 → PyInstaller 打 exe → Inno Setup
#            编译安装程序；两个产物用 persist_to_workspace 交给 smoke，
#            再用 store_artifacts 留档。
#   smoke —— 取回产物 → smoke-windows.ps1 验 exe 面板 → 两项负向验证
#            （错版本号 / 空产物目录时冒烟必须失败）→ smoke-installer.ps1
#            静默安装 → 核对 → 静默卸载。
#
# 与 GitHub Actions 的差异（都已按 CircleCI 官方文档改过）：
# - 没有 actions/setup-python、setup-node、upload-artifact/download-artifact，
#   一律用原生步骤：checkout / run / store_artifacts /
#   persist_to_workspace / attach_workspace。
# - 执行器：machine + windows-server-2022-gui:current + windows.medium，
#   shell 为 powershell.exe -ExecutionPolicy Bypass（官方文档 Quickstart 写法）。
# - PowerShell 跑外部命令（npm / python / pip / pyinstaller / iscc / exe）
#   失败时默认不会让步骤失败，所以每个外部命令后面都显式判
#   $LASTEXITCODE 再 exit；不能只靠 $ErrorActionPreference。
# - 跨步骤传值：Windows 上没有 BASH_ENV 那套，版本号每次从 pyproject.toml
#   现读（与 GH 的“读当前版本号”步骤同一段 Select-String 代码）。
# - 触发：只在 main 分支 push 时跑（省额度）；不加定时触发。
#   注意：本文件本身合进 main 就会触发一次。
#
# 镜像自带软件（windows-server-2022-gui:current，2025.10.1 版）：
#   Python 3.13.7、Node v24.9.0、Chocolatey 2.5.1、Git、7zip、pwsh。
#   镜像每月更新，版本号会漂；GH 锁的是 Python 3.12 与 Node 20，
#   所以 build 里用 choco --allow-downgrade 装回 3.12.0 / 20.11.0
#   并验版本，验不过直接失败（不要静默用错版本打出来）。
#   流水线 #1 实测：镜像已漂到 Node v26.12.1，且 choco 装完 Node 20 后
#   同一步内 node 仍解析到 v26——光从注册表刷新 PATH 不够，镜像 Node 26
#   的目录排在 choco 的 Node 20 前面；修法是把磁盘上的 v20 node.exe
#   所在目录顶到 PATH 最前面（本步会话 + 机器注册表，后续步骤继承）。
#   若以后磁盘上根本找不到 v20（降级没落盘），再看这一步打出的候选
#   列表定是先卸镜像 Node 还是跟进镜像默认版本。
#
#   流水线 #3 实测：choco 装的 Inno Setup 6.7.1 里没有
#   Languages\ChineseSimplified.isl，iscc 编译 .iss 第 59 行 [Languages]
#   段时报错退出码 2；修法是“安装 Inno Setup”后加一步补文件：先查，
#   没有就从官方仓库 jrsoftware/issrc 取官方语言文件并校验，下载失败
#   才改用官方安装包（GitHub Releases 的 innosetup-6.7.4.exe）重装。
#   注意 GitHub 那边 build-exe.yml 已补上同样的步骤（2026-11-24 仓库改公开
#   时同步加的），Actions 那边不会再缺这个文件。
#
# 额度估算：windows.medium 40 credits/分钟；build 约 5–10 分钟、
#   smoke 约 5–10 分钟，一次全流程约 400–800 credits；
#   每月 30,000 credits 约够 40–70 次。
#
# update-flow 移植（v39，2026-11-22，lucky 定“走 CircleCI 跑验证”）：
#   GitHub 那边的 .github/workflows/update-flow-test.yml（workflow_dispatch，
#   三个 job：Main / Lock / Retry）搬过来，逻辑一字不改——脚本
#   scripts/ci/update-flow-windows.ps1 本来就是 pwsh 写的，CircleCI
#   镜像里有 pwsh，直接 pwsh -File 调；它用 $env:RUNNER_TEMP，取不到
#   时自动回落到 $env:TEMP，CircleCI 上走回落分支。
#   触发方式：pipeline 参数（见文件顶部的 parameters）。默认
#   run_update_flow=false，push 时不跑；手动触发时传 true + 参数。
#   网页触发：CircleCI 项目页 → Trigger Pipeline → 填参数；
#   API 触发：curl -X POST https://circleci.com/api/v2/project/gh/
#   lluo38403-cyber/jianli-lieshou-bh/pipeline -H "Circle-Token: <写权限
#   token>" -d '{"branch":"main","parameters":{"run_update_flow":true,
#   "from_version":"1.1.24","from_run_id":"44995985867","to_version":"1.1.25"}}'
#   （注意：只读 token muse-sandbox-read 触发不了，API 触发要另建
#   Write 权限的 token；网页触发不用 token。）
#   前置条件（缺一不可，见任务汇报）：
#   ① GH_TOKEN：旧版产物仍走 gh run download（GitHub API，不耗
#      Actions 额度），CircleCI 里没有 GitHub token，必须在项目设置 →
#      Environment Variables 里加 GH_TOKEN（细粒度 PAT，Actions 只读
#      即可；from_run_id=44995985867 已核实是 v38 的打 exe run，
#      headSha eca180b）。没设会直接失败，不静默跳过。
#   ② v39 已上中转：新版包从中转下，中转还是 1.1.24 时 check
#      找不到 1.1.25，必失败。
#   ③ 旧版 exe 仍从 GitHub 取（中转只留最新包，没有旧版下载口），
#      所以 GH_TOKEN 不能省。
#   无输出超时：脚本的 ready 轮询最长 900 秒不打印、等 bat 自删最长
#   600 秒不打印，CircleCI 默认 10 分钟无输出就杀步骤，所以脚本那步
#   设了 no_output_timeout: 30m；gh 下载那步 20m。三个场景并行，
#   一次全流程约 1200–1500 credits。
#   负向验证（只在 Main 场景）：to_version 写 9.9.9 那次必须失败，
#   与 GH 的做法一致（GH 是两步：continue-on-error + 断言步；这里
#   合并成一步，exit 0 就 throw）。
version: 2.1

# 流水线参数：只给 update-flow 用。默认值 = v38→v39 这一轮的值，
# 触发时按需覆盖。run_update_flow 默认 false——push 不跑它。
parameters:
  run_update_flow:
    type: boolean
    default: false
  from_version:
    type: string
    default: "1.1.24"
  from_run_id:
    type: string
    default: "44995985867"
  to_version:
    type: string
    default: ""

executors:
  windows:
    resource_class: windows.medium
    machine:
      image: windows-server-2022-gui:current
      shell: powershell.exe -ExecutionPolicy Bypass

jobs:
  build:
    executor: windows
    steps:
      - checkout
      - run:
          name: 核对镜像自带工具
          command: |
            if (-not (Get-Command choco -ErrorAction SilentlyContinue)) { throw '镜像里没有 choco' }
            if (-not (Get-Command pwsh -ErrorAction SilentlyContinue)) { throw '镜像里没有 pwsh（PowerShell Core），冒烟脚本跑不了' }
            if (-not (Get-Command git -ErrorAction SilentlyContinue)) { throw '镜像里没有 git' }
            Write-Host "choco：$(choco --version)"
            Write-Host "pwsh：$(pwsh --version)"
            Write-Host "镜像自带 python：$(python --version 2>&1)"
            Write-Host "镜像自带 node：$(node --version 2>&1)"
      - run:
          name: 装 Python 3.12 与 Node 20
          command: |
            choco install python --version=3.12.0 --allow-downgrade --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            choco install nodejs --version=20.11.0 --allow-downgrade --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            # choco 改的是机器 PATH；当前进程要从注册表重读（等价于 refreshenv，
            # choco 的 refreshenv 只对 cmd 有效，PowerShell 里自己读注册表）。
            $machinePath = [System.Environment]::GetEnvironmentVariable('Path', 'Machine')
            $userPath = [System.Environment]::GetEnvironmentVariable('Path', 'User')
            $env:Path = "$machinePath;$userPath"
            $pyVer = python --version 2>&1
            $nodeVer = node --version 2>&1
            Write-Host "python：$pyVer"
            Write-Host "node：$nodeVer（解析自 $((Get-Command node -ErrorAction SilentlyContinue).Source)）"
            if ($pyVer -notmatch '3\.12\.') { throw "Python 不是 3.12.x（现在是 $pyVer），构建用的版本不对" }
            if ($nodeVer -notmatch 'v20\.') {
              # 流水线 #1 在这里失败：node 仍是镜像自带的 v26。只刷新 PATH 不够——
              # 镜像 Node 26 的目录排在 choco 的 Node 20 前面（或根本不在同一目录）。
              # 把磁盘上所有 node.exe 都列出来，挑 v20 的那个顶到 PATH 最前面；
              # 只修本步不够，还要写回机器 PATH（注册表），后续步骤的新 shell
              # 读注册表才能继承（CircleCI Windows 上每个 run 步骤都是新 shell）。
              $candidates = @()
              foreach ($c in (Get-Command node -All -ErrorAction SilentlyContinue).Source) { $candidates += $c }
              foreach ($p in @("$env:ProgramFiles\nodejs\node.exe", "${env:ProgramFiles(x86)}\nodejs\node.exe", "$env:ProgramData\chocolatey\bin\node.exe")) {
                if (Test-Path $p) { $candidates += $p }
              }
              $candidates = @($candidates | Select-Object -Unique)
              Write-Host '磁盘上的 node 候选：'
              $node20Dir = $null
              foreach ($p in $candidates) {
                $v = & $p --version 2>&1
                Write-Host "  $p -> $v"
                if ((-not $node20Dir) -and ($v -match '^v20\.')) { $node20Dir = Split-Path $p }
              }
              if (-not $node20Dir) { throw '磁盘上找不到 Node v20.x（choco 的降级没落盘，见上方候选列表）；不要静默用镜像的 Node 26 打包' }
              $env:Path = "$node20Dir;$env:Path"
              [System.Environment]::SetEnvironmentVariable('Path', "$node20Dir;$machinePath", 'Machine')
              Write-Host "已把 $node20Dir 顶到 PATH 最前面（本步会话 + 机器注册表）"
              $nodeVer = node --version 2>&1
              Write-Host "置顶后 node：$nodeVer（解析自 $((Get-Command node -ErrorAction SilentlyContinue).Source)）"
              if ($nodeVer -notmatch 'v20\.') { throw "Node 仍不是 v20.x（现在是 $nodeVer），放弃" }
            }
      - run:
          name: 构建前端
          working_directory: src/bosshunter/web/frontend
          command: |
            npm ci
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            npm run build
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run:
          name: 安装依赖
          command: |
            python -m pip install --upgrade pip
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            pip install .
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            pip install pyinstaller
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run:
          name: 打包
          no_output_timeout: 20m
          command: |
            pyinstaller jianli-lieshou-bh.spec
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run:
          name: 烟测 exe 版本
          command: |
            # exe 是无窗口程序（console=False），--version 的输出不会回到控制台，
            # 这里只断言“能跑、退出码 0”；版本号本身由 smoke job 的面板核对。
            dist\简历猎手\简历猎手.exe --version
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - persist_to_workspace:
          root: .
          paths:
            - dist/简历猎手
      - store_artifacts:
          path: dist/简历猎手
          destination: 简历猎手-windows
      - run:
          name: 安装 Inno Setup
          command: |
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run:
          name: 补 Inno 中文语言文件
          command: |
            # 流水线 #3 在这里失败：choco 装的 Inno Setup 6.7.1 里没有
            # Languages\ChineseSimplified.isl，iscc 编译 .iss 第 59 行
            # [Languages] 段时报错退出码 2。安装界面必须保持中文（买家看），
            # 不能改英文、不能手写 .isl 凑数。
            # 修法：先查 Languages 文件夹，没有就从 Inno Setup 官方源码
            # 仓库 jrsoftware/issrc 取官方语言文件
            # （Files/Languages/ChineseSimplified.isl），取到后校验非空
            # 且含中文语言串；下载失败才改用官方安装包重装（兜底）。
            $innoDir = "${env:ProgramFiles(x86)}\Inno Setup 6"
            $langDir = Join-Path $innoDir 'Languages'
            $isl = Join-Path $langDir 'ChineseSimplified.isl'
            $islUrl = 'https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/ChineseSimplified.isl'
            if (Test-Path $isl) {
              Write-Host 'ChineseSimplified.isl 已在，跳过补文件'
            } else {
              Write-Host "Languages 里没有 ChineseSimplified.isl，从官方仓库取：$islUrl"
              if (-not (Test-Path $langDir)) { New-Item -ItemType Directory -Force -Path $langDir | Out-Null }
              $downloaded = $false
              try {
                Invoke-WebRequest -Uri $islUrl -OutFile $isl -UseBasicParsing
                $downloaded = $true
              } catch {
                Write-Host "官方仓库下载失败：$($_.Exception.Message)"
              }
              if (-not $downloaded) {
                # 兜底：官方安装包重装（当前官方下载在 GitHub Releases；
                # jrsoftware.org/download.php/is.exe 已 404，别用旧链接）。
                $officialUrl = 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe'
                Write-Host "下载失败，改用官方安装包重装 Inno Setup：$officialUrl"
                $installer = Join-Path $env:TEMP 'innosetup-official.exe'
                try {
                  Invoke-WebRequest -Uri $officialUrl -OutFile $installer -UseBasicParsing
                } catch {
                  throw "官方安装包下载失败：$($_.Exception.Message)"
                }
                & $installer /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-
                if ($LASTEXITCODE -ne 0) { throw "官方安装包安装失败，退出码 $LASTEXITCODE" }
                Remove-Item -Force $installer -ErrorAction SilentlyContinue
              }
            }
            # 校验：文件必须存在、非空、是官方中文语言文件（含简体中文
            # 语言名与 Inno 6.5.0+ 头注释）；不过就直接失败，不往下走。
            if (-not (Test-Path $isl)) { throw '补完仍没有 ChineseSimplified.isl，放弃编译' }
            $islInfo = Get-Item $isl
            if ($islInfo.Length -lt 5000) { throw "ChineseSimplified.isl 只有 $($islInfo.Length) 字节，像是下载不完整，放弃编译" }
            $islText = Get-Content $isl -Raw -Encoding UTF8
            if ($islText -notmatch 'LanguageName\s*=\s*简体中文') { throw 'ChineseSimplified.isl 里没有“简体中文”语言名，文件不对，放弃编译' }
            if ($islText -notmatch 'Inno Setup version 6\.5\.0\+') { throw 'ChineseSimplified.isl 里没有 Inno 6.5.0+ 头注释，文件不对，放弃编译' }
            Write-Host "中文语言文件就绪：$isl（$($islInfo.Length) 字节）"
      - run:
          name: 编译安装程序
          command: |
            $line = Get-Content pyproject.toml | Select-String -Pattern '^version = "(.*)"$' | Select-Object -First 1
            if (-not $line) { throw 'pyproject.toml 里没找到 version' }
            $version = $line.Matches.Groups[1].Value
            # 注意：这里是 powershell.exe 5.1，没有 PS 7 的 ?. 空条件运算符
            # （GH 的 build-exe.yml 跑的是 pwsh 7，那边能写 ?.；流水线 #2
            # 就是把那行原样抄过来、5 秒解析失败。先存变量再取 .Source。）
            $isccCmd = Get-Command iscc -ErrorAction SilentlyContinue
            $iscc = $null
            if ($isccCmd) { $iscc = $isccCmd.Source }
            if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
            if (-not (Test-Path $iscc)) { throw '找不到 Inno Setup 编译器 ISCC.exe（choco 安装可能失败）' }
            & $iscc /DMyAppVersion=$version installer\jianli-lieshou.iss
            if ($LASTEXITCODE -ne 0) { throw "iscc 编译失败，退出码 $LASTEXITCODE" }
            $built = Get-ChildItem dist-installer\*.exe
            if (-not $built) { throw 'dist-installer 里没有安装程序产物' }
            Write-Host "安装程序：$($built.Name)"
      # 注意：安装程序是这一步之后才编译出来的，所以上面那次 persist
      # 只交了 dist/简历猎手；这里再 persist 一次安装程序产物。
      # CircleCI 的 workspace 是多次 persist 的并集。
      - persist_to_workspace:
          root: .
          paths:
            - dist-installer
      - store_artifacts:
          path: dist-installer
          destination: 简历猎手-安装程序-windows

  # Windows 冒烟测试：用上面 build 好的产物本身跑一遍，不走蓝奏云下载。
  # 只做浅测：不登录任何真实招聘平台、不投递真实简历、不填 AI Key、
  # 不用真机器码薅试用（冒烟脚本启动时设 JIANLI_NO_AUTH_SYNC=1，跳过
  # 中转授权同步）、不触发自动更新换文件。任何一步失败都让整个流程失败。
  smoke:
    executor: windows
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run:
          name: 冒烟测试
          command: |
            $line = Get-Content pyproject.toml | Select-String -Pattern '^version = "(.*)"$' | Select-Object -First 1
            if (-not $line) { throw 'pyproject.toml 里没找到 version' }
            $version = $line.Matches.Groups[1].Value
            Write-Host "当前版本：v$version"
            Copy-Item -Recurse dist\简历猎手 $env:TEMP\smoke-run
            pwsh -File scripts/ci/smoke-windows.ps1 -ExeDir "$env:TEMP\smoke-run" -ExpectedVersion "$version"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - run:
          name: "负向验证：版本号故意写错，冒烟必须失败"
          when: always
          command: |
            $line = Get-Content pyproject.toml | Select-String -Pattern '^version = "(.*)"$' | Select-Object -First 1
            if (-not $line) { throw 'pyproject.toml 里没找到 version' }
            $version = $line.Matches.Groups[1].Value
            pwsh -File scripts/ci/smoke-windows.ps1 -ExeDir "$env:TEMP\smoke-run" -ExpectedVersion "9.9.9"
            if ($LASTEXITCODE -eq 0) { Write-Host '负向验证没起作用：版本号写错 9.9.9，冒烟居然通过了'; exit 1 }
            Write-Host '负向验证通过：错版本号被冒烟测试抓住了'
      - run:
          name: "负向验证：产物目录是空的，冒烟必须失败"
          when: always
          command: |
            $line = Get-Content pyproject.toml | Select-String -Pattern '^version = "(.*)"$' | Select-Object -First 1
            if (-not $line) { throw 'pyproject.toml 里没找到 version' }
            $version = $line.Matches.Groups[1].Value
            New-Item -ItemType Directory -Force -Path "$env:TEMP\smoke-empty" | Out-Null
            pwsh -File scripts/ci/smoke-windows.ps1 -ExeDir "$env:TEMP\smoke-empty" -ExpectedVersion "$version"
            if ($LASTEXITCODE -eq 0) { Write-Host '负向验证没起作用：空产物目录，冒烟居然通过了'; exit 1 }
            Write-Host '负向验证通过：空产物被冒烟测试抓住了'
      - run:
          name: "安装程序冒烟：静默安装 → 核对 → 静默卸载"
          command: |
            $line = Get-Content pyproject.toml | Select-String -Pattern '^version = "(.*)"$' | Select-Object -First 1
            if (-not $line) { throw 'pyproject.toml 里没找到 version' }
            $version = $line.Matches.Groups[1].Value
            $installer = Get-ChildItem dist-installer\*.exe | Select-Object -First 1
            if (-not $installer) { throw '安装程序产物没拿到（workspace 里没有 dist-installer）' }
            pwsh -File scripts/ci/smoke-installer.ps1 -InstallerExe $installer.FullName -ExpectedVersion "$version"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # 更新全流程测试：GitHub Actions 的 update-flow-test.yml 的移植。
  # 三个场景（Main / Lock / Retry）是同一个 job 的三次调用，各跑在
  # 自己的机器上、各自从旧版 run 下产物，互不干扰；判定逻辑全在
  # scripts/ci/update-flow-windows.ps1 里（ready 900 秒超时、bat 自删
  # 后才读 verdict、data/ 哈希排除运行时文件），这里只负责搭台子。
  # 注意：这个 job 绝不能在每次 push 时跑（一次约 1200–1500 credits），
  # 只由带 run_update_flow=true 的流水线触发。
  update-flow:
    parameters:
      scenario:
        type: enum
        enum: ["Main", "Lock", "Retry"]
        default: "Main"
      from_version:
        type: string
      from_run_id:
        type: string
      to_version:
        type: string
      negative_check:
        type: boolean
        default: false
    executor: windows
    steps:
      - checkout
      - run:
          name: 装 GitHub CLI（取旧版产物用）
          command: |
            if (Get-Command gh -ErrorAction SilentlyContinue) {
              Write-Host "gh 已在镜像里：$(gh --version | Select-Object -First 1)"
            } else {
              Write-Host '镜像里没有 gh，choco 装一个'
              choco install gh --yes --no-progress
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              # choco 改的是机器 PATH；当前进程要从注册表重读。
              $machinePath = [System.Environment]::GetEnvironmentVariable('Path', 'Machine')
              $userPath = [System.Environment]::GetEnvironmentVariable('Path', 'User')
              $env:Path = "$machinePath;$userPath"
              gh --version
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
      - run:
          name: 读目标版本号
          command: |
            if ('<< parameters.to_version >>' -ne '') {
              $version = '<< parameters.to_version >>'
            } else {
              $line = Get-Content pyproject.toml | Select-String -Pattern '^version = "(.*)"$' | Select-Object -First 1
              if (-not $line) { throw 'pyproject.toml 里没找到 version' }
              $version = $line.Matches.Groups[1].Value
            }
            Write-Host "目标版本：v$version（旧版 v<< parameters.from_version >>，产物 run << parameters.from_run_id >>，场景 << parameters.scenario >>）"
            $version | Out-File -FilePath "$env:TEMP\updateflow-to-version.txt" -Encoding utf8 -NoNewline
      - run:
          name: 下载旧版产物
          no_output_timeout: 20m
          command: |
            # gh run download 只调 GitHub API，不耗 Actions 额度；但 CircleCI
            # 里没有 GitHub token，必须事先在项目设置 → Environment Variables
            # 里加 GH_TOKEN（细粒度 PAT，Actions 只读即可）。没设就明确失败。
            if (-not $env:GH_TOKEN) { throw '没拿到 GH_TOKEN：取旧版产物要 GitHub token（actions: read），去 CircleCI 项目设置 → Environment Variables 里加 GH_TOKEN 再触发' }
            gh run download << parameters.from_run_id >> --name 简历猎手-windows --dir prev-artifact -R lluo38403-cyber/jianli-lieshou-bh
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            if (-not (Test-Path prev-artifact\简历猎手.exe)) { throw '旧版产物下载后没有 简历猎手.exe' }
            Write-Host '旧版产物就绪'
      - run:
          name: "更新全流程（场景 << parameters.scenario >>）"
          no_output_timeout: 30m
          command: |
            # 注意：脚本的 ready 轮询最长 900 秒不打印、等 bat 自删最长
            # 600 秒不打印，CircleCI 默认 10 分钟无输出就杀步骤，所以
            # 这步设了 no_output_timeout: 30m（见本步骤定义）。
            $version = Get-Content "$env:TEMP\updateflow-to-version.txt" -Raw
            Copy-Item -Recurse prev-artifact "$env:TEMP\update-run-<< parameters.scenario >>"
            pwsh -File scripts/ci/update-flow-windows.ps1 -ExeDir "$env:TEMP\update-run-<< parameters.scenario >>" -FromVersion "<< parameters.from_version >>" -ToVersion "$version" -Scenario << parameters.scenario >>
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - when:
          condition: << parameters.negative_check >>
          steps:
            - run:
                name: "负向验证：目标版本故意写错，更新流程必须失败"
                no_output_timeout: 30m
                command: |
                  # GH 那边是两步（continue-on-error 跑一次 + 断言步）；这里
                  # 合并成一步：9.9.9 那次必须失败，exit 0 就直接 throw。
                  # 只在 Main 场景跑（negative_check=true），Lock/Retry 不跑。
                  # 注意：run 步骤的 when 只认 always/on_success/on_fail 三个
                  # 枚举，不能直接插布尔参数；条件执行必须用 when 条件步骤包
                  # 一层（2026-11-23 00:13 流水线 15 实测：when 插 true/false
                  # 直接报 12 项校验违规，三个作业全灭）。
                  Copy-Item -Recurse prev-artifact "$env:TEMP\update-neg"
                  pwsh -File scripts/ci/update-flow-windows.ps1 -ExeDir "$env:TEMP\update-neg" -FromVersion "<< parameters.from_version >>" -ToVersion "9.9.9" -Scenario << parameters.scenario >>
                  if ($LASTEXITCODE -eq 0) { throw '负向验证没起作用：目标版本写错 9.9.9，更新流程居然通过了' }
                  Write-Host '负向验证通过：错目标版本被更新流程测试抓住了'

workflows:
  version: 2
  build-and-smoke:
    jobs:
      - build:
          filters:
            branches:
              only: main
      - smoke:
          requires:
            - build
          filters:
            branches:
              only: main
  # 手动触发专用：默认 run_update_flow=false，push 时整个 workflow
  # 直接跳过，不烧额度。触发时三个场景并行，各跑各的机器。
  update-flow:
    when: << pipeline.parameters.run_update_flow >>
    jobs:
      - update-flow:
          name: update-flow-main
          scenario: Main
          from_version: << pipeline.parameters.from_version >>
          from_run_id: << pipeline.parameters.from_run_id >>
          to_version: << pipeline.parameters.to_version >>
          negative_check: true
          filters:
            branches:
              only: main
      - update-flow:
          name: update-flow-lock
          scenario: Lock
          from_version: << pipeline.parameters.from_version >>
          from_run_id: << pipeline.parameters.from_run_id >>
          to_version: << pipeline.parameters.to_version >>
          filters:
            branches:
              only: main
      - update-flow:
          name: update-flow-retry
          scenario: Retry
          from_version: << pipeline.parameters.from_version >>
          from_run_id: << pipeline.parameters.from_run_id >>
          to_version: << pipeline.parameters.to_version >>
          filters:
            branches:
              only: main
