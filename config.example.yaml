# 简历猎手 配置文件
# 复制此文件为 config.yaml 并修改为你的实际配置

profile:
  resume_path: "./resume.md"
  # 用于校招/社招岗位筛选与 AI 评分；留空保持旧行为。
  education: ""
  recruitment_type: ""  # campus / experienced / both
  ai_greeting_enabled: true  # 关闭后使用下面的固定招呼语，不调用 AI 生成或优化
  fixed_greeting: ""  # 关闭 AI 时必填，最多 300 字；发送仍需人工确认
  greeting_preference: ""  # 只补充招呼语语气与内容偏好，不覆盖事实和安全规则
  resume_output_dir: "./data/resumes"
  target_roles: ["你的目标岗位1", "目标岗位2", "目标岗位3"]
  target_cities: ["北京"]
  salary_min: 15  # K
  salary_max: 25  # K
  salary_ceil_ratio: 1.5  # 岗位薪资下限超过 salary_max × 该倍数时过滤
  filter_unparsed_salary: true  # 过滤面议或无法解析薪资的岗位
  allow_internship: false  # 开启时自动关闭 filter_unparsed_salary，避免日薪实习被误过滤
  deal_breakers: ["外包", "996"]
  jd_deal_breakers: []  # 示例：需要排除完整 JD 中的词时再填写
  blocked_companies: [] # 示例：不希望采集的公司名称或关键词
  # 可选：个人亮点（用于招呼语生成）
  extra_highlights:
    - "你的核心竞争力描述"
  # 可选：在线作品集链接
  portfolio_url: ""

search:
  keywords: ["关键词1", "关键词2"]
  cities: ["北京"]
  city_codes: {}  # 自定义城市名称 -> 平台城市编码，由配置页自动填写
  max_pages: 5
  sort: newest

collection:
  # Continuous collection is opt-in per Web task; limits and risk checks still apply.
  default_order: [boss]
  auto_score_default: false
  # 以下页面额度只统计 BOSS 直聘；智联和 51job 不占用。
  daily_search_page_limit: 60     # BOSS 单日搜索页上限
  daily_detail_page_limit: 900    # BOSS 单日详情页尝试上限
  max_consecutive_page_failures: 3
  risk_pause_min_minutes: 5       # BOSS 风险信号后随机暂停下限
  risk_pause_max_minutes: 10      # BOSS 风险信号后随机暂停上限
  collection_delay_multiplier: 1.5 # BOSS 采集等待时间倍数
  delivery_cooldown_min_minutes: 5   # BOSS 采集结束到 BOSS 投递的随机冷却下限
  delivery_cooldown_max_minutes: 15  # BOSS 采集结束到 BOSS 投递的随机冷却上限

platforms:
  boss:
    enabled: true
    search:
      city_yield_policy:
        enabled: true
        warmup_minutes: 10
        window_minutes: 5
        min_new_jobs: 5
      keywords: ["关键词1", "关键词2"]
      cities: ["北京"]
      city_codes: {}
      max_pages: 5
      sort: newest
  zhilian:
    enabled: false
    search:
      keywords: []
      cities: []
      # 只需填写城市名称；BossHunter 会从内置智联目录自动匹配城市编码。
      city_codes: {}
      max_pages: 3
      sort: default
  51job:
    enabled: false
    # 51job 同样支持人工确认后自动投递与消息巡查；消息巡查只做未读统计、不代回。
    search:
      keywords: []
      cities: ["上海"]
      city_codes: {"上海": "020000"}
      max_pages: 1
      sort: default
  liepin:
    enabled: false
    # 猎聘同样支持人工确认后自动投递与消息巡查；消息巡查只做未读统计、不代回。
    search:
      keywords: []
      cities: []
      # 只需填写城市名称；BossHunter 会从内置猎聘目录自动匹配城市编码。
      city_codes: {}
      max_pages: 1
      sort: default

scoring:
  threshold: 70
  max_candidates: 20

throttle:
  daily_limit: 30
  # 分平台日上限（单平台一天最多投这么多；全局 daily_limit 仍是总天花板）
  daily_limit_per_platform:
    boss: 80
    zhilian: 80
    51job: 80
    liepin: 80
  interval_min: 60
  interval_max: 180
  # 两次点击之间的人性化停顿：高斯随机，默认 3-8 秒
  micro_delay_min: 3
  micro_delay_max: 8
  browse_before_greet: true
  browse_duration_min: 15
  browse_duration_max: 30
  # 非 BOSS 平台详情页投递前的滚动浏览时长（秒）
  detail_browse_min: 6
  detail_browse_max: 12
  # 多平台错峰：投递换平台时随机歇这么久（秒，高斯）
  platform_stagger_min: 30
  platform_stagger_max: 120
  # 验证码阻断：等用户手动验证的最长等待（分钟）
  captcha_wait_timeout_minutes: 120
  # 熔断：一个平台连续失败这么多次，当天挂起
  breaker_max_consecutive_failures: 3
  send_windows:
    - "09:00-17:00"
  day_off_probability: 0.05

ai:
  provider: "relay"
  service: "relay"               # relay / anthropic / deepseek / doubao / zhipu / custom / local
  # 模型由云端中转决定，本地不再填 model。
  # AI 走云端中转，服务商 Key 不再进包：exe 只调中转，不带任何 Key。
  # relay_token 只挡中转滥用、不是服务商 Key，丢了可在服务端轮换。
  relay_url: "http://43.139.24.90:8687"
  relay_token: "d2118d4f9923e2eee55928cce5a44c4f"
  thinking: "auto"               # auto / disabled / enabled / off（切回直连时用）
  thinking_budget: 2048           # thinking=enabled 时使用，至少 1024
  timeout_seconds: 180
  scoring_max_tokens: 8192
  scoring_max_attempts: 2
  scoring_concurrency: 3          # AI评分并发数，默认3，范围1-3；数据库仍串行写入
  scoring_second_review: false    # 可选：对68-79分临界岗位进行一次独立复核
  greeting_max_tokens: 8192
  greeting_review_max_tokens: 4096
  greeting_max_attempts: 2
  # 可选：为不同任务覆盖通用 thinking 与超时设置
  # scoring_thinking_mode: "enabled"
  # scoring_timeout_seconds: 180
  # greeting_thinking_mode: "auto"
  # greeting_timeout_seconds: 180
  greeting_review_threshold: 7
  greeting_style_suggestions: false  # 可选质量提醒；只检查一次，不拒绝或自动改写文案
  resume_max_pages: 3
  # 切回直连时才用下面这些：把 service/provider 改回对应服务商，
  # Key 写进 ai.services.<服务>.api_key（首次启动后会被挪到 exe 旁
  # .config.credentials.yaml，0600，不进 git）；模型填 model 行。
  # 风险：Key 在分发的包里，有心人能从 exe 里翻出来——只用免费模型，
  # 发现被刷就换 Key；不要把付费 Key 写进来。
  # base_url 填写后优先生效；留空时才读取对应环境变量或使用服务商默认地址
  # （ANTHROPIC_API_KEY / DEEPSEEK_API_KEY / ARK_API_KEY / ZHIPU_API_KEY / OPENAI_API_KEY）
  # base_url: "https://api.anthropic.com"

auth:
  # 鉴权展示配置（只有展示用的值，没有任何密钥）：
  # buy_url 发卡网购买链接、wechat_id 客服微信号、wechat_qr_path
  # 客服二维码图地址。改这一处，全端跟着换，不用改业务代码。
  # 注意：buy_url 故意留空——空着就不显示购买按钮，有链接再填。
  # 微信号是默认值、二维码图目前是占位图（src/bosshunter/web/frontend/public/wechat-qr.png），
  # 都要 lucky 确认/替换；二维码图换成真实客服微信二维码图即可
  # （文件名不变，或改下面的路径）。
  buy_url: ""
  wechat_id: "jmlq2004"
  wechat_qr_path: "/wechat-qr.png"

monitor:
  interval: 30
  # 仅“运行全流程”发送结束后生效；单独监测会立即执行首轮
  initial_cooldown_minutes: 10
  chat_url: "https://www.zhipin.com/web/geek/chat"
  # v27：聊天页按平台分开配；chat_url 只留作 BOSS 的旧配置兼容。
  # 其余三家默认是各平台消息中心入口（不是专用聊天页直链），可改。
  chat_urls:
    boss: "https://www.zhipin.com/web/geek/chat"
    zhilian: "https://i.zhaopin.com/"
    51job: "https://i.51job.com/"
    liepin: "https://www.liepin.com/msg/"
  max_conversations_per_cycle: 5
  max_consecutive_page_failures: 3
  max_resume_sends_per_cycle: 5
  auto_reply_hr_questions: false

follow_up:
  enabled: false
  interval_hours: 30
  skip_weekends: true

dedup:
  history_file: "./data/history.jsonl"

safety:
  daily_platform_page_limit: 1100  # 仅 BOSS：采集、投递和监测合计的页面打开硬上限
  risk_lock_minutes: 10           # 旧版 24 小时锁已取消；投递/监测风险最多短时冷却

browser:
  runtime: "builtin"
  proxy_host: "127.0.0.1"
  proxy_port: 3456
  chrome_ports: [9222, 9229, 9333]
  auto_start_proxy: true
  enable_port_guard: true
  site_patterns: true
  # 用哪个浏览器：auto 自动选择（优先 Chrome，没有再用 Edge）/ chrome / edge / manual 手动路径
  browser_choice: "auto"
  # 手动模式才用的浏览器启动文件完整路径；其他模式下忽略它
  executable_path: ""
