# 简历猎手（BossHunter 重建版）· 在 GitHub 免费的 Windows 机器上打 exe
# 手动触发：仓库 Actions 页 → 打 Windows exe → Run workflow。
# 产物在 Actions 运行记录的 Artifacts 里，名字叫「简历猎手-windows」，
# 下载后解压，双击里面的「简历猎手.exe」。
name: 打 Windows exe

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/bosshunter/web/frontend/package-lock.json
      - name: 构建前端
        working-directory: src/bosshunter/web/frontend
        run: |
          npm ci
          npm run build
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pyinstaller
      - name: 打包
        run: pyinstaller jianli-lieshou-bh.spec
      - name: 烟测 exe 版本
        run: dist\简历猎手\简历猎手.exe --version
      - name: 烟测面板（复制一份跑，不污染产物）
        shell: powershell
        run: |
          Copy-Item -Recurse dist\简历猎手 $env:RUNNER_TEMP\smoke
          $proc = Start-Process -FilePath "$env:RUNNER_TEMP\smoke\简历猎手.exe" -ArgumentList "web","--no-open" -PassThru
          try {
            $ok = $false
            for ($i=0; $i -lt 30; $i++) {
              Start-Sleep -Seconds 2
              try {
                $r = Invoke-WebRequest -Uri "http://127.0.0.1:8686/" -UseBasicParsing -TimeoutSec 3
                if ($r.StatusCode -eq 200) { $ok = $true; break }
              } catch {}
            }
            if (-not $ok) { throw "面板没有起来" }
            Write-Host "面板 OK（HTTP 200）"
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }
      - name: 上传 exe
        uses: actions/upload-artifact@v4
        with:
          name: 简历猎手-windows
          path: dist/简历猎手
