# 简历猎手（BossHunter 重建版）· 在 GitHub 免费的 Windows 机器上打 exe
# 手动触发：仓库 Actions 页 → 打 Windows exe → Run workflow。
# 产物在 Actions 运行记录的 Artifacts 里，名字叫「简历猎手-windows」，
# 下载后解压，双击里面的「简历猎手.exe」。
# 同一次构建还用 Inno Setup 编译安装程序（installer/jianli-lieshou.iss），
# 第二个 artifact 叫「简历猎手-安装程序-windows」，里面是
# 简历猎手-安装程序-<版本号>.exe（默认装到安装包所在目录下的
# 简历猎手文件夹）。
# 打完之后自动跑 Windows 冒烟测试（smoke job）：用构建产物本身启动面板验一遍，
# 再对安装程序跑一遍静默安装 → 核对 → 静默卸载（scripts/ci/smoke-installer.ps1）。
name: 打 Windows exe

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/bosshunter/web/frontend/package-lock.json
      - name: 构建前端
        working-directory: src/bosshunter/web/frontend
        run: |
          npm ci
          npm run build
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pyinstaller
      - name: 注入中转钥匙
        # v49：仓库里不再放真钥匙。打包时把 GitHub secret RELAY_APP_TOKEN
        # 注入 config.example.yaml 的空占位，随包发出去；secret 不存在
        # 时注入脚本直接报错停下，绝不打出没钥匙的包。
        env:
          RELAY_APP_TOKEN: ${{ secrets.RELAY_APP_TOKEN }}
        run: python scripts/ci/inject-relay-token.py
      - name: 打包
        run: pyinstaller jianli-lieshou-bh.spec
      - name: 烟测 exe 版本
        run: dist\简历猎手\简历猎手.exe --version
      - name: 上传 exe
        uses: actions/upload-artifact@v4
        with:
          name: 简历猎手-windows
          path: dist/简历猎手
      - name: 安装 Inno Setup
        run: choco install innosetup --yes --no-progress
      - name: 补 Inno 中文语言文件
        shell: pwsh
        run: |
          # choco 装的 Inno Setup 6.7.1 里没有 Languages\ChineseSimplified.isl，
          # iscc 编译 .iss 第 59 行 [Languages] 段时报错退出码 2。安装界面必须保持中文（买家看），
          # 不能改英文、不能手写 .isl 凑数。先查，没有就从 Inno Setup 官方源码仓库
          # jrsoftware/issrc 取官方语言文件（Files/Languages/ChineseSimplified.isl），
          # 取到后校验非空且含中文语言串；下载失败才改用官方安装包重装（兜底）。
          $innoDir = "${env:ProgramFiles(x86)}\Inno Setup 6"
          $langDir = Join-Path $innoDir 'Languages'
          $isl = Join-Path $langDir 'ChineseSimplified.isl'
          $islUrl = 'https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/ChineseSimplified.isl'
          if (Test-Path $isl) {
            Write-Host 'ChineseSimplified.isl 已在，跳过补文件'
          } else {
            Write-Host "Languages 里没有 ChineseSimplified.isl，从官方仓库取：$islUrl"
            if (-not (Test-Path $langDir)) { New-Item -ItemType Directory -Force -Path $langDir | Out-Null }
            $downloaded = $false
            try {
              Invoke-WebRequest -Uri $islUrl -OutFile $isl -UseBasicParsing
              $downloaded = $true
            } catch {
              Write-Host "官方仓库下载失败：$($_.Exception.Message)"
            }
            if (-not $downloaded) {
              # 兜底：官方安装包重装（当前官方下载在 GitHub Releases；
              # jrsoftware.org/download.php/is.exe 已 404，别用旧链接）。
              $officialUrl = 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe'
              Write-Host "下载失败，改用官方安装包重装 Inno Setup：$officialUrl"
              $installer = Join-Path $env:TEMP 'innosetup-official.exe'
              try {
                Invoke-WebRequest -Uri $officialUrl -OutFile $installer -UseBasicParsing
              } catch {
                throw "官方安装包下载失败：$($_.Exception.Message)"
              }
              & $installer /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP-
              if ($LASTEXITCODE -ne 0) { throw "官方安装包安装失败，退出码 $LASTEXITCODE" }
              Remove-Item -Force $installer -ErrorAction SilentlyContinue
            }
          }
          # 校验：文件必须存在、非空、是官方中文语言文件（含简体中文
          # 语言名与 Inno 6.5.0+ 头注释）；不过就直接失败，不往下走。
          if (-not (Test-Path $isl)) { throw '补完仍没有 ChineseSimplified.isl，放弃编译' }
          $islInfo = Get-Item $isl
          if ($islInfo.Length -lt 5000) { throw "ChineseSimplified.isl 只有 $($islInfo.Length) 字节，像是下载不完整，放弃编译" }
          $islText = Get-Content $isl -Raw -Encoding UTF8
          if ($islText -notmatch 'LanguageName\s*=\s*简体中文') { throw 'ChineseSimplified.isl 里没有“简体中文”语言名，文件不对，放弃编译' }
          if ($islText -notmatch 'Inno Setup version 6\.5\.0\+') { throw 'ChineseSimplified.isl 里没有 Inno 6.5.0+ 头注释，文件不对，放弃编译' }
          Write-Host "中文语言文件就绪：$isl（$($islInfo.Length) 字节）"
      - name: 编译安装程序
        shell: pwsh
        run: |
          $line = Get-Content pyproject.toml | Select-String -Pattern '^version = "(.*)"$' | Select-Object -First 1
          if (-not $line) { throw 'pyproject.toml 里没找到 version' }
          $version = $line.Matches.Groups[1].Value
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue)?.Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { throw '找不到 Inno Setup 编译器 ISCC.exe（choco 安装可能失败）' }
          & $iscc /DMyAppVersion=$version installer\jianli-lieshou.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc 编译失败，退出码 $LASTEXITCODE" }
          $built = Get-ChildItem dist-installer\*.exe
          if (-not $built) { throw 'dist-installer 里没有安装程序产物' }
          Write-Host "安装程序：$($built.Name)"
      - name: 上传安装程序
        uses: actions/upload-artifact@v4
        with:
          name: 简历猎手-安装程序-windows
          path: dist-installer

  # Windows 冒烟测试：用上面 build 好的产物本身跑一遍，不走蓝奏云下载。
  # 只做浅测：不登录任何真实招聘平台、不投递真实简历、不填 AI Key、
  # 不用真机器码薅试用（冒烟脚本启动时设 JIANLI_NO_AUTH_SYNC=1，跳过
  # 中转授权同步）、不触发自动更新换文件。试用倒计时只看界面上有没有
  # 正常显示，不等它走完。任何一步失败都让整个 CI 失败。
  smoke:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: 简历猎手-windows
          path: smoke-artifact
      - name: 读当前版本号
        id: version
        shell: pwsh
        run: |
          $line = Get-Content pyproject.toml | Select-String -Pattern '^version = "(.*)"$' | Select-Object -First 1
          if (-not $line) { throw 'pyproject.toml 里没找到 version' }
          $version = $line.Matches.Groups[1].Value
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "当前版本：v$version"
      - name: 冒烟测试
        id: smoke
        shell: pwsh
        run: |
          Copy-Item -Recurse smoke-artifact $env:RUNNER_TEMP\smoke-run
          pwsh -File scripts/ci/smoke-windows.ps1 -ExeDir "$env:RUNNER_TEMP\smoke-run" -ExpectedVersion "${{ steps.version.outputs.version }}"
      - name: "负向验证：版本号故意写错，冒烟必须失败"
        id: neg-version
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          pwsh -File scripts/ci/smoke-windows.ps1 -ExeDir "$env:RUNNER_TEMP\smoke-run" -ExpectedVersion "9.9.9"
      - name: "断言：错版本号那次确实失败了"
        if: always()
        shell: pwsh
        run: |
          if ('${{ steps.neg-version.outcome }}' -ne 'failure') { throw '负向验证没起作用：版本号写错 9.9.9，冒烟居然通过了' }
          Write-Host '负向验证通过：错版本号被冒烟测试抓住了'
      - name: "负向验证：产物目录是空的，冒烟必须失败"
        id: neg-package
        if: always()
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\smoke-empty" | Out-Null
          pwsh -File scripts/ci/smoke-windows.ps1 -ExeDir "$env:RUNNER_TEMP\smoke-empty" -ExpectedVersion "${{ steps.version.outputs.version }}"
      - name: "断言：空产物那次确实失败了"
        if: always()
        shell: pwsh
        run: |
          if ('${{ steps.neg-package.outcome }}' -ne 'failure') { throw '负向验证没起作用：空产物目录，冒烟居然通过了' }
          Write-Host '负向验证通过：空产物被冒烟测试抓住了'
      - name: 下载安装程序产物
        uses: actions/download-artifact@v4
        with:
          name: 简历猎手-安装程序-windows
          path: installer-artifact
      - name: "安装程序冒烟：静默安装 → 核对 → 静默卸载"
        shell: pwsh
        run: |
          $installer = Get-ChildItem installer-artifact\*.exe | Select-Object -First 1
          if (-not $installer) { throw '安装程序产物没下载到' }
          pwsh -File scripts/ci/smoke-installer.ps1 -InstallerExe $installer.FullName -ExpectedVersion "${{ steps.version.outputs.version }}"
